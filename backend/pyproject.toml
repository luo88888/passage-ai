[project]
name = "ai-passage-creator-backend"
version = "0.0.1"
description = "AI 爆款文章创作器 - Python 后端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==43.0.3",
    "databases[mysql]==0.9.0",
    "redis==5.2.0",
    "aioredis==2.0.1",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "passlib[bcrypt]==1.7.4",
    "python-dateutil==2.9.0.post0",
    "openai>=1.109.1",
    "httpx==0.28.1",
    "cos-python-sdk-v5==1.9.32",
    "google-genai==1.35.0",     # Gemini AI 生图（Nano Banana）
    "beautifulsoup4==4.12.3",   # HTML 解析（表情包搜索）
    "lxml==5.3.0",              # BeautifulSoup4 的 lxml 解析器
    "stripe>=14.3.0",           # Stripe 支付
    "langchain-deepseek>=1.1.0", # DeepSeek LLM 集成
    "langgraph>=1.1.0",         # LangGraph 多智能体编排图框架
    "langgraph-checkpoint-sqlite>=2.0.0",  # LangGraph SQLite 检查点（人机协同断点续跑）
    "langchain>=1.0.0",                        # LangChain v1 create_agent（信息收集智能体）
    "ddgs>=9.14.4",
    "markdownify>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
